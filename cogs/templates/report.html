<!DOCTYPE html>
<html>
<head>
    <title>Report - {{ report.trade_id }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .report-box {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #ff4444;
        }
        .section {
            margin-bottom: 15px;
        }
        .section-title {
            font-weight: bold;
            color: #333;
        }
        pre {
            background-color: #eee;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="report-box">
        <h2>Trade Report - {{ report.trade_id }}</h2>

        <div class="section">
            <span class="section-title">Summary:</span>
            <p>{{ report.summary or 'No summary provided.' }}</p>
        </div>

        {% if report.messages %}
        <div class="section">
            <span class="section-title">Messages:</span>
            <ul>
                {% for msg in report.messages %}
                <li><strong>{{ msg }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

        {% if report.reason %}
        <div class="section">
            <span class="section-title">Reason:</span>
            <p>{{ report.reason }}</p>
        </div>
        {% endif %}

        <!-- Optional: Add support/favor button -->
        <div class="section">
            <button onclick="alert('Feature not implemented yet')">In Favor?</button>
        </div>
    </div>
</body>
</html>
